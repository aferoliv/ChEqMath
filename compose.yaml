name: especiacao

services:
  api:
    # Contexto na raiz para que o Dockerfile copie a planilha de data/ para a imagem.
    # (Bind mount de pasta no Google Drive (G:) aparece vazia dentro do Docker Desktop.)
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8090:80"               # 8080 costuma estar ocupada por outros projetos
    depends_on:
      - api
    restart: unless-stopped
